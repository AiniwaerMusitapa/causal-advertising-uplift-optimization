name: Artifact consistency checks

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  check-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check snapshot (no training or download)
        run: python -m unittest discover -s tests -v
      - name: Display recorded result summary
        run: python scripts/05_snapshot_summary.py
      - name: Verify preflight command is available
        run: python scripts/06_preflight.py --help
